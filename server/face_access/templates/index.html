<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人脸识别管理</title><link rel="stylesheet" href="/static/access.css"><script type="module" src="/static/api.js"></script></head>
<body><header><div><span class="eyebrow">RK3568 · 局域网管理</span><h1>人脸识别管理</h1></div><button id="logout" hidden>退出管理</button></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<section id="login-panel" class="card login"><h2>管理员登录</h2><p id="setup-notice">首次使用，请先在板卡上设置管理密码。</p><form id="login-form"><label>管理密码<input id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="current-password"></label><button type="submit">登录</button></form><p class="muted">管理页面闲置5分钟后退出。HTTP适用于当前可信局域网。</p></section>
<div id="workspace" hidden><nav aria-label="管理功能"><button data-panel="events" class="selected">识别记录</button><button data-panel="visits">进出配对</button><button data-panel="anomalies">异常处理</button><button data-panel="people">人员与样本</button><button data-panel="stations">终端与规则</button></nav>
<section id="records-panel" class="card"><div class="section-heading"><h2 id="records-title">识别记录</h2><span id="timezone" class="muted"></span></div>
<form id="filters" class="filters"><label>人员ID<input name="person_id" maxlength="128" placeholder="全部人员"></label><label data-filter="time">开始时间<input name="from" type="datetime-local"></label><label data-filter="time">结束时间<input name="to" type="datetime-local"></label><label data-filter="events">方向<select name="direction"><option value="">全部</option><option value="IN">进</option><option value="OUT">出</option></select></label><label data-filter="events">终端<select name="station_id"><option value="">全部终端</option><option value="board-in">板卡摄像头</option><option value="pc-out">历史电脑终端</option></select></label><label data-filter="events">识别结果<select name="decision"><option value="">全部</option><option value="allowed">已授权</option><option value="denied">无权限</option></select></label><label data-filter="visits">配对状态<select name="status"><option value="">全部</option><option value="matched">已配对</option><option value="pending">待出场</option><option value="overdue">已超时</option></select></label><label data-filter="anomalies">异常类型<select name="kind"><option value="">全部</option><option value="duplicate_entry">重复进入</option><option value="exit_without_entry">无进入却离开</option><option value="missing_exit">超时未离开</option></select></label><label data-filter="anomalies">处理状态<select name="resolved"><option value="">全部</option><option value="false">待处理</option><option value="true">已处理</option></select></label><label data-filter="anomalies">异常范围<select name="include_history"><option value="false">当前异常</option><option value="true">含历史异常</option></select></label><button type="submit">查询 / 刷新</button><button type="button" id="export">导出CSV</button></form>
<div class="table-wrap"><table id="records-table"><thead></thead><tbody></tbody></table></div><div class="pagination"><button id="previous">上一页</button><span id="page-info"></span><button id="next">下一页</button></div></section>
<section id="people-panel" class="card" hidden><div class="section-heading"><h2>人员与样本</h2><button id="rebuild-gallery" data-library-write>重建图库</button></div><p class="muted">修改人员状态或样本后请重建图库。重建任务完成后才显示结果。</p><div class="people-layout"><div><form id="people-search" class="toolbar"><label>人员ID或姓名<input id="people-query" maxlength="128" placeholder="搜索人员"></label><button type="submit">搜索 / 刷新</button><button type="button" id="new-person" data-library-write>新增人员</button></form><div class="table-wrap"><table id="people-table"><thead><tr><th>人员ID</th><th>姓名</th><th>状态</th><th>照片</th><th>操作</th></tr></thead><tbody></tbody></table></div><div class="pagination"><button id="people-previous">上一页</button><span id="people-page"></span><button id="people-next">下一页</button></div></div><div id="person-detail" hidden><h3>人员资料 · <span id="person-id"></span></h3><form id="person-form" class="dialog-form"><label>姓名<input id="person-name" maxlength="128" required data-library-write></label><label>组别<select id="person-group" data-library-write><option value="in_group">组内</option><option value="out_group">组外</option></select></label><label><span><input id="person-enabled" type="checkbox" data-library-write>启用此人员</span></label><div class="actions"><button type="submit" data-library-write>保存资料</button><button type="button" id="delete-person" class="danger" data-library-write>删除人员</button></div></form><hr><h3>人脸照片</h3><form id="sample-upload" class="dialog-form"><label>选择清晰单人脸照片（JPEG/PNG，每张不超过8MiB）<input id="sample-files" type="file" accept="image/jpeg,image/png" multiple required data-library-write></label><button type="submit" data-library-write>上传并提取人脸</button></form><div id="sample-list" class="samples"></div><div class="pagination"><button id="samples-previous">上一页</button><span id="samples-page"></span><button id="samples-next">下一页</button></div></div></div></section>
<section id="stations-panel" class="card" hidden><h2>终端与规则</h2><p class="muted">电脑仅用于网页管理。板卡使用本地摄像头做人脸识别；方向可在此切换为进或出，切换后旧方向的缓存结果会被丢弃。</p><div id="station-list" class="station-grid"></div><hr><form id="timeout-form" class="inline-form"><label>未离开超时（分钟，0表示关闭）<input id="timeout-minutes" type="number" min="0" max="525600" required></label><button>保存规则</button></form><p class="muted">关闭超时后，仍检查重复进入和无进入却离开。</p></section>
</div></main><footer>原始识别记录保留当时姓名与权限快照。人员资料修改不会改写历史。</footer></body></html>
